{% extends "base.html" %}

{% block title %}Detalle de Juego - GameHub{% endblock %}

{% block content %}
<div class="container">
    <!-- Contenedor inyectado por JS -->
    <div id="detalleJuego">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Cargando detalles del juego...</p>
        </div>
    </div>

    <!-- Sección de Reseñas -->
    <div class="review-section" style="margin-top:40px;">
        <h3 style="margin-bottom:20px;">Reseñas de la Comunidad</h3>
        <div id="msgResena"></div>

        <div class="form-card req-auth hidden"
            style="margin-bottom:30px; box-shadow:none; border:1px solid var(--color-border); max-width:100%;">
            <h4 style="margin-bottom:15px;">Escribir una reseña</h4>
            <form id="formResena">
                <div class="form-group">
                    <label>Calificación</label>
                    <select id="calificacion" class="form-control" style="max-width:150px;" required>
                        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4">⭐⭐⭐⭐ (4)</option>
                        <option value="3">⭐⭐⭐ (3)</option>
                        <option value="2">⭐⭐ (2)</option>
                        <option value="1">⭐ (1)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Comentario</label>
                    <textarea id="comentario" class="form-control" required rows="3"
                        placeholder="¿Qué te pareció este juego?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Publicar reseña</button>
            </form>
        </div>

        <div class="req-unauth"
            style="margin-bottom:30px; padding:20px; background:var(--color-surface); border-radius:var(--radius-medium); text-align:center; border:1px solid var(--color-border);">
            <p>Debes <a href="/login">iniciar sesión</a> para dejar una reseña.</p>
        </div>

        <div id="listaResenas">
            <!-- Cargado por JS -->
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/resenas.js"></script>
{% endblock %}
