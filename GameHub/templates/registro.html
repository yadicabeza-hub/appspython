{% extends "base.html" %}

{% block title %}Registro - GameHub{% endblock %}

{% block content %}
<div class="container" style="display:flex; justify-content:center; align-items:center; min-height:70vh;">
    <div class="form-card form-card-auth">
        <h2 style="color:var(--color-primary); margin-bottom:10px;">GameHub</h2>
        <h3 style="margin-bottom:20px; font-weight:600;">Crear Cuenta</h3>
        
        <div id="msgRegistro"></div>
        
        <form id="formRegistro">
            <div class="form-group">
                <label>Nombre de Usuario</label>
                <input type="text" id="nombre_usuario" class="form-control" required placeholder="Ej. indie_dev99">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="correo" class="form-control" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="contrasena" class="form-control" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirmar Contraseña</label>
                <input type="password" id="confirmar" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px; padding:12px;">Registrarse</button>
        </form>
        
        <p style="margin-top:25px; font-size:14px; color:var(--color-text-secondary);">
            ¿Ya tienes una cuenta? <a href="/login" style="font-weight:600; color:var(--color-primary);">Inicia sesión aquí</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/autenticacion.js"></script>
{% endblock %}
