{% extends "base.html" %}

{% block title %}Iniciar Sesión - GameHub{% endblock %}

{% block content %}
<div class="container" style="display:flex; justify-content:center; align-items:center; min-height:60vh;">
    <div class="form-card form-card-auth">
        <h2 style="color:var(--color-primary); margin-bottom:10px;">GameHub</h2>
        <h3 style="margin-bottom:20px; font-weight:600;">Iniciar Sesión</h3>
        
        <div id="msgLogin"></div>
        
        <form id="formLogin">
            <div class="form-group">
                <label>Usuario o Correo</label>
                <input type="text" id="username" class="form-control" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="contrasena" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px; padding:12px;">Entrar a mi cuenta</button>
        </form>
        
        <p style="margin-top:25px; font-size:14px; color:var(--color-text-secondary);">
            ¿No tienes cuenta? <a href="/registro" style="font-weight:600; color:var(--color-primary);">Regístrate como creador</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/autenticacion.js"></script>
{% endblock %}
