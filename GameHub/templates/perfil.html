{% extends "base.html" %}

{% block title %}Mi Perfil - GameHub{% endblock %}

{% block content %}
<div class="container" id="infoPerfil">
    <!-- Cabecera del Perfil -->
    <div class="profile-header">
        <div class="profile-cover"></div>
        <div class="profile-content-wrapper">
            <div style="position:relative; flex-shrink:0;">
                <img id="fotoPerfil" class="profile-avatar" src="https://via.placeholder.com/150" alt="Foto de Perfil">
                <button onclick="document.getElementById('fileFoto').click()" class="btn btn-outline" style="position:absolute; bottom:0; left:50%; transform:translateX(-50%); background:var(--color-surface); font-size:11px; padding:4px 10px; border-radius: 12px; box-shadow: var(--shadow-small); z-index:2;">Cambiar</button>
                <input type="file" id="fileFoto" class="hidden" accept="image/*">
            </div>
            
            <div class="profile-info" style="flex-grow:1; padding-bottom: 15px;">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:15px;">
                    <div>
                        <h2 id="nombreCompleto">Cargando...</h2>
                        <h4 id="usernameDisplay" style="margin-top:-3px;"></h4>
                        <p style="font-size:14px; color:var(--color-text-secondary); margin-bottom:12px; display:flex; align-items:center; gap:10px;">
                            <span class="tag" style="background:var(--color-primary-soft); color:var(--color-primary-dark); font-weight:700;"><span id="tipo"></span></span> 
                            <span>🌍 <span id="pais"></span></span>
                        </p>
                        <p id="biografia" style="max-width:600px; font-size:15px; line-height:1.6; margin-bottom:0; color:var(--color-text);"></p>
                    </div>
                    
                    <div style="display:flex; gap: 10px;">
                        <button onclick="document.getElementById('formEditarPerfil').classList.toggle('hidden')" class="btn btn-outline">Editar Perfil</button>
                        <a href="/publicar_juego" class="btn btn-primary">Publicar juego</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulario de Edición (Oculto por defecto) -->
    <div id="formEditarPerfil" class="form-card hidden" style="margin-bottom:40px;">
        <h3 style="margin-bottom:20px;">Actualizar Información</h3>
        <div id="msgPerfil"></div>
        <form id="formUpdatePerfil">
            <div class="grid-juegos" style="grid-template-columns: 1fr 1fr; gap:15px;">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="edit_nombre" class="form-control">
                </div>
                <div class="form-group">
                    <label>País</label>
                    <input type="text" id="edit_pais" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label>Biografía</label>
                <textarea id="edit_bio" class="form-control" rows="4"></textarea>
            </div>
            <div style="text-align:right;">
                <button type="button" onclick="document.getElementById('formEditarPerfil').classList.add('hidden')" class="btn btn-outline">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </div>

    <!-- Juegos del Usuario -->
    <div class="section-header">
        <h3>Juegos Publicados por Mí</h3>
    </div>
    
    <!-- Aquí se inyectarán los juegos en forma de lista o cuadrícula -->
    <!-- El JS actual crea un <ul> pero podemos adaptarlo si el JS actual no tiene formato estricto -->
    <ul id="listaMisJuegos" style="list-style:none; padding:0;"></ul>
    <p style="font-size:14px; color:var(--color-text-secondary);"><a href="/mis_juegos" style="text-decoration:underline;">Ir al dashboard de Mis Juegos para administrarlos.</a></p>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/autenticacion.js"></script>
<script>
    document.getElementById('fileFoto').addEventListener('change', async (e) => {
        if (e.target.files.length > 0) {
            const fd = new FormData();
            fd.append('file', e.target.files[0]);
            try {
                const res = await apiFetch('/perfiles/me/fotografia', { method: 'POST', body: fd });
                document.getElementById('fotoPerfil').src = res.fotografia;
            } catch(error) { 
                alert("Error al cambiar la foto: " + error.message); 
            }
        }
    });
</script>
{% endblock %}
